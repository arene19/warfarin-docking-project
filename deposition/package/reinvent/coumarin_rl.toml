run_type = "staged_learning"
use_cuda = true
tb_logdir = "tb_logs"
json_out_config = "coumarin_rl.json"

[parameters]
summary_csv_prefix = "coumarin_generation"
use_checkpoint = false
batch_size = 64
unique_sequences = true
randomize_smiles = true
# Install REINVENT4 separately; point prior/agent to your REINVENT4 models directory.
prior_file = "models/reinvent.prior"
agent_file = "models/reinvent.prior"

[learning_strategy]
type = "dap"
rate = 0.0001
sigma = 120

[diversity_filter]
type = "IdenticalMurckoScaffold"
bucket_size = 25
minscore = 0.4

[[stage]]
chkpt_file = "coumarin_agent.chkpt"
termination = "simple"
max_score = 0.8
max_steps = 150

[stage.scoring]
type = "geometric_mean"

    [[stage.scoring.component]]
    [stage.scoring.component.SAScore]
    name = "Synthetic_Accessibility"
    weight = 1.5
    [[stage.scoring.component.SAScore.endpoint]]
    name = "SA_Score_Endpoint"
    weight = 1.0
    transform.type = "reverse_sigmoid"
    transform.high = 4.5
    transform.low = 2.0
    transform.k = 0.5

    [[stage.scoring.component]]
    [stage.scoring.component.QED]
    name = "QED_Score"
    weight = 1.0
    [[stage.scoring.component.QED.endpoint]]
    name = "QED"

    [[stage.scoring.component]]
    [stage.scoring.component.MolecularWeight]
    name = "MW"
    weight = 0.5
    [[stage.scoring.component.MolecularWeight.endpoint]]
    name = "MW_endpoint"
    weight = 1.0
    transform.type = "double_sigmoid"
    transform.high = 500.0
    transform.low = 150.0
    transform.coef_div = 100.0
    transform.coef_si = 20.0
    transform.coef_se = 20.0

    [[stage.scoring.component]]
    [stage.scoring.component.ExternalProcess]
    name = "GNN_VKORC1_Potency"
    weight = 2.5
    [[stage.scoring.component.ExternalProcess.endpoint]]
    name = "Pred_VKORC1_pXC50"
    weight = 2.5
    params.executable = "python"
    params.args = "gnn_predict.py --checkpoint coagulation_admet_gnn.pth --target Pred_VKORC1_pXC50"
    params.property = "Pred_VKORC1_pXC50"
    transform.type = "sigmoid"
    transform.high = 9.0
    transform.low = 5.0
    transform.k = 0.5
